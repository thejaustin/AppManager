import javax.inject.Inject
import java.nio.file.Files
import java.nio.file.Paths
import java.util.stream.Collectors

plugins {
    id('com.android.library')
    id('org.jetbrains.kotlin.android')
}

android {
    namespace = 'io.github.muntashirakon.AppManager.server'
    compileSdk = compile_sdk
    buildToolsVersion = build_tools

    defaultConfig {
        minSdk = min_sdk
        targetSdk = target_sdk
    }

    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    compileOnly project(path: ':hiddenapi')

    api project(path: ':libserver')

    implementation "androidx.annotation:annotation:${annotation_version}"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:${desugar_jdk_version}"
}

// https://docs.gradle.org/current/userguide/service_injection.html#execoperations
interface InjectedExecOps {
    @Inject
    ExecOperations getExecOps()
}

android.libraryVariants.configureEach { variant ->
    String buildType = variant.buildType.name
    String buildTypeCap = buildType.capitalize()
    def compileTask = variant.javaCompileProvider
    def libServerCompileTask = project(':libserver').tasks.named("compile${buildTypeCap}JavaWithJavac")
    def injected = project.objects.newInstance(InjectedExecOps)
    tasks.register("create${buildTypeCap}ServerJars") {
        inputs.dir(compileTask.map { it.destinationDirectory.get() })
        inputs.dir(libServerCompileTask.map { it.destinationDirectory.get() })

        String serverPkg = "io/github/muntashirakon/AppManager/server"
        String srcDir = buildType == "release" ? "main" : buildType
        File assetsDir = file("${project.rootDir}/app/src/${srcDir}/assets")
        File amJar = new File(assetsDir, "am.jar")
        File mainJar = new File(assetsDir, "main.jar")

        outputs.file(amJar)
        outputs.file(mainJar)

        doLast {
            println("Building Server JARs for type: ${buildType}")
            assetsDir.mkdirs()

            String serverClassDir = compileTask.get().destinationDirectory.get().asFile.absolutePath
            String libserverClassDir = libServerCompileTask.get().destinationDirectory.get().asFile.absolutePath + "/${serverPkg}/common"

            def getClassFiles = { dirPath, filter ->
                def dir = new File(dirPath)
                if (dir.exists() && dir.isDirectory()) {
                    return Files.list(dir.toPath())
                            .filter { filter(it.fileName.toString()) }
                            .map { it.toString() }
                            .collect(Collectors.toList())
                }
                return []
            }

            String rootDir = project.rootDir.absolutePath
            String intermediatePath = "build/intermediates/javac/${buildType}/compile${buildType.capitalize()}JavaWithJavac/classes"
            String kotlinIntermediatePath = "build/tmp/kotlin-classes/${buildType}"

            String serverJavaClassDir = "${rootDir}/server/${intermediatePath}/${serverPkg}/"
            String serverKotlinClassDir = "${rootDir}/server/${kotlinIntermediatePath}/${serverPkg}/"
            String libserverJavaClassDir = "${rootDir}/libserver/${intermediatePath}/${serverPkg}/common"
            String libserverKotlinClassDir = "${rootDir}/libserver/${kotlinIntermediatePath}/${serverPkg}/common"


            String androidJar = "${android.sdkDirectory.path}/platforms/android-${target_sdk}/android.jar"
            String d8Path = "${android.sdkDirectory.path}/build-tools/${android.buildToolsVersion}/d8"
            // Make sure the build script and d8 use the same version of java.
            String gradleJavaHome = System.getProperty("java.home")
            File gradleJava = new File(gradleJavaHome, "bin/java")
            if (!gradleJava.isFile()) {
                gradleJavaHome = new File(gradleJavaHome).parent
            }
            String gradlePath = "${gradleJavaHome}/bin:${System.getenv('PATH')}"

            def runD8 = { List<String> args ->
                injected.execOps.exec {
                    environment "JAVA_HOME", gradleJavaHome
                    environment "PATH", gradlePath
                    executable = d8Path
                    it.args(args)
                }
            }

            println("Creating am.jar...")
            def amArgs = ['--release', '--min-api', min_sdk, '--output', amJar.absolutePath, '--lib', androidJar]
            amArgs.addAll(getClassFiles(libserverJavaClassDir, { !it.startsWith("IRootServiceManager") }))
            amArgs.addAll(getClassFiles(libserverKotlinClassDir, { !it.startsWith("IRootServiceManager") }))
            amArgs.addAll(getClassFiles(serverJavaClassDir, { !it.startsWith("RootServiceMain") }))
            amArgs.addAll(getClassFiles(serverKotlinClassDir, { !it.startsWith("RootServiceMain") }))
            runD8(amArgs)
            println("Created ${amJar}")

            println("Creating main.jar...")
            def mainArgs = ['--release', '--min-api', min_sdk, '--output', mainJar.absolutePath, '--lib', androidJar]
            mainArgs.addAll(getClassFiles(libserverJavaClassDir, { it.startsWith("IRootServiceManager") || it.startsWith("ServerUtils") }))
            mainArgs.addAll(getClassFiles(libserverKotlinClassDir, { it.startsWith("IRootServiceManager") || it.startsWith("ServerUtils") }))
            mainArgs.addAll(getClassFiles(serverJavaClassDir, { it.startsWith("RootServiceMain") }))
            mainArgs.addAll(getClassFiles(serverKotlinClassDir, { it.startsWith("RootServiceMain") }))
            runD8(mainArgs)
            println("Created ${mainJar}")
        }
    }

    compileTask.configure { finalizedBy("create${buildTypeCap}ServerJars") }
}

tasks.register('cleanupServerJars') {
    doLast {
        String rootDir = rootProject.projectDir.absolutePath
        file("${rootDir}/app/src/main/assets/am.jar").delete()
        file("${rootDir}/app/src/main/assets/main.jar").delete()
        file("${rootDir}/app/src/debug/assets/am.jar").delete()
        file("${rootDir}/app/src/debug/assets/main.jar").delete()
    }
}

clean.dependsOn cleanupServerJars
